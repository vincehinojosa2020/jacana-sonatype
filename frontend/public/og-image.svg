<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A51C30"/>
      <stop offset="50%" style="stop-color:#8A1527"/>
      <stop offset="100%" style="stop-color:#A51C30"/>
    </linearGradient>
    <clipPath id="circle">
      <rect x="510" y="45" width="180" height="180"/>
    </clipPath>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Gold top line -->
  <rect x="0" y="0" width="1200" height="6" fill="#D4AF37"/>
  
  <!-- Corner accents -->
  <path d="M30 90 L30 30 L90 30" stroke="#D4AF37" stroke-width="3" fill="none" opacity="0.4"/>
  <path d="M1110 30 L1170 30 L1170 90" stroke="#D4AF37" stroke-width="3" fill="none" opacity="0.4"/>
  <path d="M30 540 L30 600 L90 600" stroke="#D4AF37" stroke-width="3" fill="none" opacity="0.4"/>
  <path d="M1110 600 L1170 600 L1170 540" stroke="#D4AF37" stroke-width="3" fill="none" opacity="0.4"/>
  
  <!-- Headshot frame -->
  <rect x="506" y="41" width="188" height="188" fill="none" stroke="#D4AF37" stroke-width="4"/>
  
  <!-- Headshot placeholder (gold circle with initials) -->
  <rect x="510" y="45" width="180" height="180" fill="#1a1a1a"/>
  <circle cx="600" cy="135" r="50" fill="#D4AF37"/>
  <text x="600" y="150" font-family="Georgia, serif" font-size="48" font-weight="bold" fill="#0A0A0A" text-anchor="middle">GT</text>
  
  <!-- Address -->
  <text x="600" y="290" font-family="Georgia, serif" font-size="64" font-weight="600" fill="white" text-anchor="middle">5214 Jacana Lane</text>
  
  <!-- City -->
  <text x="600" y="330" font-family="Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.8)" text-anchor="middle" letter-spacing="4">SAN JOSE, CALIFORNIA</text>
  
  <!-- Price -->
  <text x="600" y="400" font-family="Georgia, serif" font-size="48" font-weight="700" fill="#D4AF37" text-anchor="middle">$950,000</text>
  
  <!-- Stats -->
  <text x="600" y="450" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.9)" text-anchor="middle" letter-spacing="2">
    <tspan font-weight="700" fill="white">3</tspan> BEDS   •   <tspan font-weight="700" fill="white">2.5</tspan> BATHS   •   <tspan font-weight="700" fill="white">1,142</tspan> SQ FT
  </text>
  
  <!-- GT Real branding -->
  <text x="600" y="550" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#D4AF37" text-anchor="middle" letter-spacing="6">GTREAL.IO</text>
  <text x="600" y="580" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="3">GET REAL. GET RESULTS.</text>
</svg>