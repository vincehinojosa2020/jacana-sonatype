<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, height=630">
    <title>OG Image Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 1200px;
            height: 630px;
            background: #A51C30;
            font-family: 'Outfit', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        /* Subtle pattern overlay */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(0,0,0,0.1) 0%, transparent 50%, rgba(0,0,0,0.15) 100%);
            pointer-events: none;
        }
        
        /* Gold accent line at top */
        .gold-line {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: #D4AF37;
        }
        
        /* Main content */
        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
        }
        
        /* Headshot container */
        .headshot-container {
            width: 180px;
            height: 180px;
            border: 4px solid #D4AF37;
            overflow: hidden;
            margin-bottom: 32px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }
        
        .headshot {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
        }
        
        /* Address */
        .address {
            font-family: 'Cormorant Garamond', serif;
            font-size: 72px;
            font-weight: 600;
            color: white;
            letter-spacing: -2px;
            margin-bottom: 8px;
            text-shadow: 0 2px 20px rgba(0,0,0,0.2);
        }
        
        .city {
            font-size: 24px;
            color: rgba(255,255,255,0.8);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 32px;
        }
        
        /* Price tag */
        .price {
            font-family: 'Cormorant Garamond', serif;
            font-size: 48px;
            font-weight: 700;
            color: #D4AF37;
            margin-bottom: 16px;
        }
        
        /* Stats */
        .stats {
            display: flex;
            gap: 32px;
            color: rgba(255,255,255,0.9);
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 40px;
        }
        
        .stat {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .stat-value {
            font-weight: 700;
            color: white;
        }
        
        /* GT Real branding */
        .gtreal {
            position: absolute;
            bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .gtreal-name {
            font-size: 28px;
            font-weight: 700;
            color: #D4AF37;
            letter-spacing: 6px;
            text-transform: uppercase;
        }
        
        .gtreal-tagline {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 4px;
        }
        
        /* Corner accents */
        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 3px solid rgba(212,175,55,0.3);
        }
        .corner-tl { top: 30px; left: 30px; border-right: none; border-bottom: none; }
        .corner-tr { top: 30px; right: 30px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: 30px; left: 30px; border-right: none; border-top: none; }
        .corner-br { bottom: 30px; right: 30px; border-left: none; border-top: none; }
    </style>
</head>
<body>
    <div class="gold-line"></div>
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>
    
    <div class="content">
        <div class="headshot-container">
            <img class="headshot" src="https://customer-assets.emergentagent.com/job_luxury-home-showcase-1/artifacts/sc55xg76_image.png" alt="George Toscano">
        </div>
        
        <div class="address">5214 Jacana Lane</div>
        <div class="city">San Jose, California</div>
        
        <div class="price">$950,000</div>
        
        <div class="stats">
            <div class="stat"><span class="stat-value">3</span> Beds</div>
            <div class="stat"><span class="stat-value">2.5</span> Baths</div>
            <div class="stat"><span class="stat-value">1,142</span> Sq Ft</div>
        </div>
    </div>
    
    <div class="gtreal">
        <div class="gtreal-name">GTREAL.IO</div>
        <div class="gtreal-tagline">Get Real. Get Results.</div>
    </div>
</body>
</html>
