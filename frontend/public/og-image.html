<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap');
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: 'Outfit', sans-serif;
  }
  
  .card {
    width: 1200px;
    height: 630px;
    background: #0A0A0A;
    display: flex;
    position: relative;
    overflow: hidden;
  }
  
  /* Background property image - right side, faded */
  .bg-image {
    position: absolute;
    right: 0;
    top: 0;
    width: 65%;
    height: 100%;
    object-fit: cover;
    opacity: 0.35;
    mask-image: linear-gradient(to right, transparent 0%, black 30%);
    -webkit-mask-image: linear-gradient(to right, transparent 0%, black 30%);
  }
  
  /* Gold accent line - top */
  .gold-line-top {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, #D4AF37, #A51C30, #D4AF37);
  }
  
  /* Gold accent line - bottom */
  .gold-line-bottom {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, #D4AF37, #A51C30, #D4AF37);
  }
  
  /* Content */
  .content {
    position: relative;
    z-index: 2;
    padding: 60px 70px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 100%;
    width: 100%;
  }
  
  /* Top section */
  .top-label {
    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #D4AF37;
    font-weight: 600;
  }
  
  /* Middle section */
  .middle {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  
  .address {
    font-family: 'Cormorant Garamond', serif;
    font-size: 72px;
    font-weight: 500;
    color: #FFFFFF;
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }
  
  .city {
    font-family: 'Outfit', sans-serif;
    font-size: 20px;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.05em;
    margin-bottom: 28px;
  }
  
  .price {
    font-family: 'Cormorant Garamond', serif;
    font-size: 56px;
    font-weight: 600;
    color: #D4AF37;
    margin-bottom: 12px;
  }
  
  .stats {
    font-family: 'Outfit', sans-serif;
    font-size: 18px;
    color: rgba(255,255,255,0.7);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  
  .stats span {
    color: rgba(255,255,255,0.3);
    margin: 0 10px;
  }
  
  /* Bottom section */
  .bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  
  .agent-info {
    display: flex;
    align-items: center;
    gap: 20px;
  }
  
  .agent-badge {
    background: #A51C30;
    padding: 10px 24px;
    display: inline-block;
  }
  
  .agent-badge p {
    font-family: 'Outfit', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: white;
    letter-spacing: 0.15em;
  }
  
  .agent-name {
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  
  .phone {
    font-family: 'Outfit', sans-serif;
    font-size: 16px;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.08em;
  }
  
  /* Decorative corner accents */
  .corner-tl, .corner-br {
    position: absolute;
    width: 40px;
    height: 40px;
    z-index: 3;
  }
  
  .corner-tl {
    top: 20px;
    left: 20px;
    border-top: 2px solid #D4AF37;
    border-left: 2px solid #D4AF37;
  }
  
  .corner-br {
    bottom: 20px;
    right: 20px;
    border-bottom: 2px solid #D4AF37;
    border-right: 2px solid #D4AF37;
  }
</style>
</head>
<body>
<div class="card">
  <!-- Background property photo -->
  <img class="bg-image" src="https://images.pexels.com/photos/16787444/pexels-photo-16787444.png" alt="">
  
  <!-- Gold accent lines -->
  <div class="gold-line-top"></div>
  <div class="gold-line-bottom"></div>
  
  <!-- Decorative corners -->
  <div class="corner-tl"></div>
  <div class="corner-br"></div>
  
  <!-- Content -->
  <div class="content">
    <div class="top-label">Just Listed &bull; GT Real</div>
    
    <div class="middle">
      <h1 class="address">5214 Jacana Lane</h1>
      <p class="city">San Jose, California 95123</p>
      <p class="price">$950,000</p>
      <p class="stats">3 Bedrooms <span>&bull;</span> 2.5 Baths <span>&bull;</span> 1,142 Sq Ft</p>
    </div>
    
    <div class="bottom">
      <div class="agent-info">
        <div class="agent-badge"><p>GTREAL.IO</p></div>
        <div>
          <p class="agent-name">George Toscano &bull; DRE# 02213878</p>
        </div>
      </div>
      <p class="phone">408-603-6603</p>
    </div>
  </div>
</div>
</body>
</html>
