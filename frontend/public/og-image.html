<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap');
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    width: 1200px;
    height: 1200px;
    overflow: hidden;
  }
  
  .card {
    width: 1200px;
    height: 1200px;
    background: #0A0A0A;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  
  /* Property photo - top half */
  .photo-section {
    position: relative;
    width: 100%;
    height: 55%;
    overflow: hidden;
  }
  
  .photo-section img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  
  /* Gradient fade from photo into dark */
  .photo-fade {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 50%;
    background: linear-gradient(to bottom, transparent, #0A0A0A);
  }
  
  /* Gold accent line */
  .gold-divider {
    width: 80px;
    height: 3px;
    background: linear-gradient(90deg, #D4AF37, #B8942E);
    margin: 0 auto;
    position: relative;
    z-index: 5;
    margin-top: -20px;
  }
  
  /* "Just Listed" badge floating on photo */
  .badge {
    position: absolute;
    top: 40px;
    left: 40px;
    z-index: 5;
    background: #A51C30;
    padding: 10px 28px;
  }
  
  .badge p {
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: white;
    font-weight: 600;
  }
  
  /* Content section - bottom half */
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px 60px 50px;
    position: relative;
    z-index: 2;
  }
  
  .address {
    font-family: 'Cormorant Garamond', serif;
    font-size: 82px;
    font-weight: 500;
    color: #FFFFFF;
    line-height: 1.0;
    letter-spacing: -0.02em;
    margin-bottom: 12px;
  }
  
  .city {
    font-family: 'Outfit', sans-serif;
    font-size: 18px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 32px;
  }
  
  .price {
    font-family: 'Cormorant Garamond', serif;
    font-size: 72px;
    font-weight: 600;
    color: #D4AF37;
    margin-bottom: 16px;
    letter-spacing: -0.01em;
  }
  
  .stats {
    font-family: 'Outfit', sans-serif;
    font-size: 18px;
    color: rgba(255,255,255,0.6);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 40px;
  }
  
  .stats .dot {
    color: #D4AF37;
    margin: 0 14px;
  }
  
  /* Bottom branding bar */
  .branding {
    display: flex;
    align-items: center;
    gap: 24px;
  }
  
  .brand-badge {
    background: #A51C30;
    padding: 12px 32px;
  }
  
  .brand-badge p {
    font-family: 'Outfit', sans-serif;
    font-size: 24px;
    font-weight: 700;
    color: white;
    letter-spacing: 0.15em;
  }
  
  .brand-separator {
    width: 1px;
    height: 30px;
    background: rgba(255,255,255,0.15);
  }
  
  .agent-name {
    font-family: 'Outfit', sans-serif;
    font-size: 15px;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  
  .phone {
    font-family: 'Outfit', sans-serif;
    font-size: 15px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.1em;
  }
  
  /* Decorative corners */
  .corner {
    position: absolute;
    width: 50px;
    height: 50px;
    z-index: 10;
  }
  .corner-tl { top: 24px; left: 24px; border-top: 2px solid rgba(212,175,55,0.4); border-left: 2px solid rgba(212,175,55,0.4); }
  .corner-tr { top: 24px; right: 24px; border-top: 2px solid rgba(212,175,55,0.4); border-right: 2px solid rgba(212,175,55,0.4); }
  .corner-bl { bottom: 24px; left: 24px; border-bottom: 2px solid rgba(212,175,55,0.4); border-left: 2px solid rgba(212,175,55,0.4); }
  .corner-br { bottom: 24px; right: 24px; border-bottom: 2px solid rgba(212,175,55,0.4); border-right: 2px solid rgba(212,175,55,0.4); }
</style>
</head>
<body>
<div class="card">
  <!-- Decorative corners -->
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>
  
  <!-- Property Photo - Top Half -->
  <div class="photo-section">
    <div class="badge"><p>Just Listed</p></div>
    <img src="https://customer-assets.emergentagent.com/job_luxury-home-showcase-1/artifacts/9eaxu7ts_eaf224eb1751e8f11ed9d12eed9b2e95-cc_ft_768.webp" alt="5214 Jacana Lane">
    <div class="photo-fade"></div>
  </div>
  
  <!-- Gold Divider -->
  <div class="gold-divider"></div>
  
  <!-- Content -->
  <div class="content">
    <h1 class="address">5214 Chiconda<br>Lane</h1>
    <p class="city">San Jose, California</p>
    <p class="price">$848,888</p>
    <p class="stats">3 Bed <span class="dot">&bull;</span> 2.5 Bath <span class="dot">&bull;</span> 1,142 Sq Ft</p>
    
    <div class="branding">
      <div class="brand-badge"><p>GTREAL.IO</p></div>
      <div class="brand-separator"></div>
      <div>
        <p class="agent-name">George Toscano</p>
        <p class="phone">408-603-6603</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
